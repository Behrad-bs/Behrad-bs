name: Update Pinned Repositories

on:
  schedule:
    - cron: '0 0 * * *' # ساعت ۱۲ هر شب اجرا میشه
  workflow_dispatch: # دکمه اجرای دستی رو تو گیت‌هاب فعال می‌کنه

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # اجازه آپدیت فایل رو به بات میده
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Repo Update Script
        run: python update_repos.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # چک می‌کنه اگر تغییری در فایل ایجاد شده بود پوش کنه
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update latest active repositories"
            git push
          fi
